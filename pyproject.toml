[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abren-one"
version = "0.1.0"
description = "Abren One — Nonprofit Operations Platform"
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.3,<6.2",
    "djangorestframework>=3.18.3,<3.19",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "ruff>=0.11",
    "pyright>=1.1",
    "import-linter>=2.1",
    "factory-boy>=3.3",
    "django-debug-toolbar>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/abren_one"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["abren_one", "config"]

# ---------------------------------------------------------------------------
# Pyright
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.15"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = ["backend/src", "backend/config"]
exclude = ["**/migrations"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["backend/src", "backend"]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = [
    "backend/tests",
    "backend/src/abren_one",
]
addopts = "--strict-markers -q"

# ---------------------------------------------------------------------------
# Import Linter
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["abren_one"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Platform does not depend on business modules"
type = "forbidden"
source_modules = ["abren_one.platform"]
forbidden_modules = ["abren_one.modules"]

[[tool.importlinter.contracts]]
name = "Business domain/application layers do not import DRF"
type = "forbidden"
source_modules = [
    "abren_one.modules.organizations.domain",
    "abren_one.modules.organizations.application",
    "abren_one.modules.programs.domain",
    "abren_one.modules.programs.application",
]
forbidden_modules = ["rest_framework"]

[[tool.importlinter.contracts]]
name = "Organizations internal layer direction"
type = "layers"
layers = [
    "abren_one.modules.organizations.interfaces",
    "abren_one.modules.organizations.application",
    "abren_one.modules.organizations.domain",
]

[[tool.importlinter.contracts]]
name = "Programs internal layer direction"
type = "layers"
layers = [
    "abren_one.modules.programs.interfaces",
    "abren_one.modules.programs.application",
    "abren_one.modules.programs.domain",
]
