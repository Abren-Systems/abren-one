services:
  postgres:
    image: postgres:16-alpine
    container_name: abren-one-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abren_one}
      POSTGRES_USER: ${POSTGRES_USER:-abren}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abren_secret_dev_pwd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abren} -d ${POSTGRES_DB:-abren_one}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: abren_one_postgres_data
